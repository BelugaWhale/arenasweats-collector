# Installed as /etc/nginx/snippets/arenasweats-collector.conf, included in the arenasweats.lol server block.
location ^~ /collector/ {
    limit_req zone=arenasweats_collector burst=60 nodelay;
    client_max_body_size 2m;
    client_body_buffer_size 1m;      # uploads stay in memory instead of a temporary file
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8870/;
}

# The collector program, served straight from disk: GitHub downloads are unreliable in China.
# fetch_download.sh keeps this copy equal to the newest GitHub release.
location = /collector/download/ArenaSweatsCollector.exe {
    limit_req zone=arenasweats_collector burst=10 nodelay;
    alias /home/admin-website-vps1/arenasweats-collector-downloads/ArenaSweatsCollector.exe;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="ArenaSweatsCollector.exe"' always;
    add_header Cache-Control "no-cache" always;
}
